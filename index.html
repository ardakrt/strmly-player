<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400&family=Plus+Jakarta+Sans:wght@400;500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet" /></noscript>
    <link rel="stylesheet" href="./tokens.css" />
    <title>Strmly</title>
    <style>
      /* Static boot splash: renders immediately from HTML/CSS alone, before
         the JS bundle loads/evaluates and React mounts. This avoids the
         perceived black-screen gap on startup (especially in dev mode where
         Vite has to transform the whole module graph on first request). */
      html, body {
        margin: 0;
        overflow-x: clip;
        background: var(--color-launch-paper);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: var(--z-launcher);
        display: grid;
        place-items: center;
        min-width: 0;
        min-height: 100dvh;
        box-sizing: border-box;
        overflow: clip;
        isolation: isolate;
        background: var(--color-launch-paper);
        color: var(--color-launch-ink);
        font-family: var(--font-launch-body);
        user-select: none;
      }
      #boot-splash, #boot-splash * { box-sizing: border-box; }
      @keyframes cinema-reveal {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes cinema-progress {
        from { transform: translateX(-140%); }
        to { transform: translateX(340%); }
      }
      #boot-splash .cinema-boot__ambient {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(ellipse 28% 34% at 50% 46%,var(--color-launch-ambient),var(--color-launch-paper) 72%);
      }
      #boot-splash .cinema-boot__identity {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 0;
        transform: translateY(-2vh);
        animation: cinema-reveal var(--dur-long) var(--ease-out) both;
      }
      #boot-splash .cinema-boot__brand {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #boot-splash .cinema-boot__brand h1 {
        margin: var(--space-xl) 0 0;
        padding-inline-start: 0.28em;
        color: var(--color-launch-ink);
        font-family: var(--font-launch-display);
        font-size: var(--text-launch-wordmark);
        font-style: normal;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.28em;
      }
      #boot-splash .cinema-boot__mark {
        display: block;
        width: var(--size-launch-mark);
        height: var(--size-launch-mark);
        aspect-ratio: 1;
        object-fit: contain;
        opacity: 0.96;
      }
      #boot-splash .cinema-boot__status {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-sm);
        margin-top: var(--space-lg);
        width: min(15rem,calc(100vw - var(--space-xl)));
        color: var(--color-launch-muted);
        font-size: var(--text-launch-meta);
        font-weight: 500;
        letter-spacing: 0.04em;
        line-height: 1.5;
        text-align: center;
      }
      #boot-splash .cinema-boot__status-label {
        max-width: 100%;
        min-height: 1.5em;
      }
      #boot-splash .cinema-boot__progress {
        position: relative;
        display: block;
        width: 7.5rem;
        height: var(--rule-launch-hair);
        overflow: clip;
        border-radius: var(--radius-launch-progress);
        background: var(--color-launch-rule);
      }
      #boot-splash .cinema-boot__progress i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        transform: translateX(-140%);
        background: var(--color-launch-ink-soft);
        animation: cinema-progress var(--dur-launch-progress) var(--ease-out) infinite;
      }
      @media (max-height: 34rem) {
        #boot-splash .cinema-boot__identity { transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .cinema-boot__identity {
          opacity: 1;
          animation: none;
        }
        #boot-splash .cinema-boot__progress i {
          width: 100%;
          transform: none;
          opacity: 0.42;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="cinema-boot__ambient" aria-hidden="true"></div>
      <main class="cinema-boot__identity">
        <div class="cinema-boot__brand" aria-hidden="true">
          <img class="cinema-boot__mark" src="./icon.png" width="88" height="88" alt="" />
          <h1>STRMLY</h1>
        </div>
        <div class="cinema-boot__status">
          <span class="cinema-boot__status-label">Strmly başlatılıyor…</span>
          <span class="cinema-boot__progress" aria-hidden="true"><i></i></span>
        </div>
      </main>
    </div>
    <script>
      (function() {
        try {
          var storedLanguage = localStorage.getItem('cinema_language');
          if (storedLanguage && storedLanguage.charAt(0) === '"') storedLanguage = JSON.parse(storedLanguage);
          var initialLanguage = storedLanguage === 'en' ? 'en' : 'tr';
          document.documentElement.lang = initialLanguage;
          var bootStatus = document.querySelector('#boot-splash .cinema-boot__status-label');
          if (bootStatus) bootStatus.textContent = initialLanguage === 'en' ? 'Starting Strmly…' : 'Strmly başlatılıyor…';

          var scale = localStorage.getItem('strmly_ui_scale');
          if (scale === 'small') document.documentElement.style.fontSize = '14px';
          else if (scale === 'large') document.documentElement.style.fontSize = '18.5px';
          
          var grain = localStorage.getItem('strmly_background_grain');
          if (grain === 'true') {
            var el = document.createElement('div');
            el.id = 'strmly-grain-overlay';
            el.className = 'grain-overlay';
            document.body.appendChild(el);
          }
        } catch(e) {
          console.warn("Strmly inline script boot warning:", e);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
